<!doctype html>
<html lang="pl">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta charset="utf-8">
<title>Spacer 3D · Apartament Pobierowo · MEBLE (szare, kontrola układu)</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600&family=Figtree:wght@400;500;600&display=swap">
<style>
/* Layout: panorama na całym ekranie, sterowanie w czterech rogach jak w aparacie; ciemne szkło nad zdjęciem */
:root{
  --ink:#f3efe8; --ink-2:rgba(243,239,232,.72); --glass:rgba(24,22,20,.62); --glass-2:rgba(24,22,20,.82);
  --line:rgba(243,239,232,.16); --accent:#d9b98c; --stage:#14120f;
  --f-disp:"Familjen Grotesk","Helvetica Neue",Arial,sans-serif; --f-body:"Figtree","Helvetica Neue",Arial,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--stage);color:var(--ink);font-family:var(--f-body);overflow:hidden;-webkit-font-smoothing:antialiased}
#stage{position:fixed;inset:0;touch-action:none;cursor:grab}
#stage.drag{cursor:grabbing}
#stage canvas{display:block;width:100%;height:100%}
.glass{background:var(--glass);backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px) saturate(1.2);border:1px solid var(--line);border-radius:14px}
#top{position:fixed;left:0;right:0;top:0;display:flex;gap:12px;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;
  padding-top:calc(14px + env(safe-area-inset-top,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none}
#top>*{pointer-events:auto}
#where{padding:10px 16px 12px;min-width:0}
#where small{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2)}
#where h1{margin:2px 0 0;font-family:var(--f-disp);font-weight:600;font-size:clamp(19px,2.4vw,26px);line-height:1.1;text-wrap:balance}
#variants,#units{display:flex;padding:4px;gap:2px;flex-wrap:wrap}
#units button{font:500 13px var(--f-body);color:var(--ink-2);background:none;border:0;border-radius:10px;padding:8px 12px;cursor:pointer}
#units button[aria-pressed="true"]{background:var(--accent);color:#1b1916}
#variants button{font:500 13px var(--f-body);color:var(--ink-2);background:none;border:0;border-radius:10px;padding:8px 12px;cursor:pointer}
#variants button[aria-pressed="true"]{background:var(--ink);color:#1b1916}
#variants button:focus-visible,.hs:focus-visible,#plan button:focus-visible,#tools button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#plan{position:fixed;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));width:min(340px,calc(100vw - 32px));padding:10px}
#plan header{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
#plan .tabs{display:flex;gap:4px}
#plan .tabs button,#plan .toggle{font:500 12px var(--f-body);color:var(--ink-2);background:none;border:1px solid var(--line);border-radius:999px;padding:5px 11px;cursor:pointer}
#plan .tabs button[aria-pressed="true"]{color:#1b1916;background:var(--accent);border-color:var(--accent)}
#map{position:relative;border-radius:8px;overflow:hidden;line-height:0}
#map img{width:100%;display:block}
#map .pt{position:absolute;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;border:2px solid #fff;background:rgba(30,28,25,.75);cursor:pointer;padding:0;
  box-shadow:0 1px 4px rgba(0,0,0,.45);transition:transform .15s}
#map .pt:hover{transform:scale(1.15)}
#map .pt.on{background:var(--accent);border-color:#1b1916}
#map .pt.on::after{content:"";position:absolute;inset:-7px;border-radius:50%;border:2px solid var(--accent);opacity:.7}
#plan.min #map{display:none}
#plan.min header{margin:0}
#tools{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:6px;padding:6px}
#tools button{width:40px;height:40px;border:0;border-radius:10px;background:none;color:var(--ink);font:600 20px var(--f-body);cursor:pointer;display:grid;place-items:center}
#tools button:hover{background:rgba(243,239,232,.12)}
#tools svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8}
#hs{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.hs{position:absolute;left:0;top:0;pointer-events:auto;width:58px;height:58px;padding:0;border-radius:50%;cursor:pointer;background:rgba(255,255,255,.22);border:2px solid rgba(255,255,255,.9);box-shadow:0 0 0 1px rgba(0,0,0,.18),0 2px 10px rgba(0,0,0,.25);transform:translate(-50%,-50%);transition:background .15s}
.hs:hover{background:rgba(255,255,255,.45)}
.hs i{display:none}
#fade{position:fixed;inset:0;background:var(--stage);opacity:0;pointer-events:none;transition:opacity .35s}
#fade.on{opacity:1}
#hint{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);font-size:13px;color:var(--ink-2);padding:8px 14px;transition:opacity .6s;pointer-events:none}
#note{position:fixed;right:max(16px,env(safe-area-inset-right,0px));top:auto;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-64px);font-size:11px;color:var(--ink-2);padding:6px 10px;max-width:220px;line-height:1.35}
@media (max-width:640px){#hint,#note{display:none}#variants button{padding:7px 9px;font-size:12px}#plan{width:min(260px,calc(100vw - 96px))}}
@media (prefers-reduced-motion:reduce){#fade{transition:none}}
</style>
<div id="stage" aria-label="Panorama 360°, przeciągnij, aby się rozejrzeć"></div>
<div id="hs"></div>
<div id="top">
  <div id="where" class="glass"><small id="floorLbl">Apartament 55 m² · Pobierowo</small><h1 id="room">Salon</h1></div>
  <div id="units" class="glass" style="display:none" role="group" aria-label="Lokal"></div>
  <div id="variants" class="glass" role="group" aria-label="Wariant wnętrza" style="display:none">
    <button data-v="A" aria-pressed="true">Jasny dąb</button><button data-v="B">Ciemne drewno</button><button data-v="C">Minimal</button><button data-v="dew">Stan deweloperski</button>
  </div>
</div>
<section id="plan" class="glass" aria-label="Plan">
  <header><div class="tabs" style="display:none"></div>
  <button class="toggle" id="planToggle" aria-expanded="true">Ukryj plan</button></header>
  <div id="map"><img id="mapImg" src="plan_pinea.jpg" alt="Rzut kondygnacji z punktami widokowymi"></div>
</section>
<div id="tools" class="glass">
  <button id="zin" aria-label="Przybliż">+</button><button id="zout" aria-label="Oddal">−</button>
  <button id="fs" aria-label="Pełny ekran"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
</div>
<div id="hint" class="glass">Przeciągnij, aby się rozejrzeć · kliknij kropkę na podłodze, aby przejść dalej</div>
<div id="fade"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const PU={"a": [{"id": "p01", "n": 1, "n5": 1, "name": "Salon", "floor": 0, "xy": [46.85, 29.89], "hs": [{"to": "p02", "u": 0.9203, "label": "Jadalnia i kuchnia", "v": -0.799}, {"to": "p08", "u": 0.8888, "label": "Przedpokój", "v": -0.764}, {"to": "p06", "u": 0.3877, "label": "Balkon (salon)", "v": -0.761}, {"to": "p03", "u": 0.8914, "label": "Hol", "v": -0.767}], "start": 0.976}, {"id": "p02", "n": 2, "n5": 2, "name": "Jadalnia i kuchnia", "floor": 0, "xy": [18.92, 29.89], "hs": [{"to": "p01", "u": 0.6289, "label": "Salon", "v": -1.225}, {"to": "p03", "u": 0.8627, "label": "Hol", "v": -0.763}, {"to": "p08", "u": 0.6522, "label": "Przedpokój", "v": -0.783}], "start": 0.5283}, {"id": "p03", "n": 3, "n5": 3, "name": "Hol", "floor": 0, "xy": [8.02, 51.84], "hs": [{"to": "p01", "u": 0.4039, "label": "Salon", "v": -0.785}, {"to": "p02", "u": 0.3616, "label": "Jadalnia i kuchnia", "v": -0.762}, {"to": "p08", "u": 0.4917, "label": "Przedpokój", "v": -0.752}], "start": 0.4842}, {"id": "p04", "n": 4, "n5": 4, "name": "Sypialnia", "floor": 0, "xy": [66.67, 68.97], "hs": [{"to": "p08", "u": 0.0165, "label": "Przedpokój", "v": -0.966}, {"to": "p07", "u": 0.3875, "label": "Balkon (sypialnia)", "v": -0.766}], "start": 0.8564}, {"id": "p05", "n": 5, "n5": 5, "name": "Łazienka", "floor": 0, "xy": [19.37, 79.31], "hs": [{"to": "p08", "u": 0.2915, "label": "Przedpokój", "v": -0.791}], "start": 0.8349}, {"id": "p06", "n": 6, "n5": 6, "name": "Balkon (salon)", "floor": 0, "xy": [79.28, 6.9], "hs": [{"to": "p01", "u": 0.8888, "label": "Salon", "v": -0.762}], "start": 0.3894}, {"id": "p07", "n": 7, "n5": 7, "name": "Balkon (sypialnia)", "floor": 0, "xy": [80.9, 54.6], "hs": [{"to": "p04", "u": 0.8892, "label": "Sypialnia", "v": -0.763}], "start": 0.4062}, {"id": "p08", "n": 8, "n5": 8, "name": "Przedpokój", "floor": 0, "xy": [28.65, 50.57], "hs": [{"to": "p01", "u": 0.3877, "label": "Salon", "v": -0.764}, {"to": "p02", "u": 0.1517, "label": "Jadalnia i kuchnia", "v": -0.776}, {"to": "p03", "u": 0.9921, "label": "Hol", "v": -0.749}, {"to": "p05", "u": 0.8465, "label": "Łazienka", "v": -0.784}, {"to": "p04", "u": 0.6129, "label": "Sypialnia", "v": -0.761}], "start": 0.7427}]};
let unit="a",P=PU.a;
let byId=Object.fromEntries(P.map(p=>[p.id,p]));
let cur='p01',variant='A',floor=0,lon=0,lat=-4,fov=75;
const stage=document.getElementById('stage');
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.outputEncoding=THREE.sRGBEncoding;
stage.appendChild(renderer.domElement);
const scene=new THREE.Scene();
const cam=new THREE.PerspectiveCamera(fov,1,0.1,100);
const geo=new THREE.SphereGeometry(50,96,64);geo.scale(-1,1,1);
const mat=new THREE.MeshBasicMaterial({color:0xffffff});
scene.add(new THREE.Mesh(geo,mat));
const loader=new THREE.TextureLoader();const cache={};
function tex(url){if(!cache[url]){cache[url]=new Promise((ok,err)=>loader.load(url,t=>{t.encoding=THREE.sRGBEncoding;t.anisotropy=renderer.capabilities.getMaxAnisotropy();ok(t)},undefined,err))}return cache[url]}
const url=(v,id)=>`pano9/A_${String(byId[id].n).padStart(2,'0')}.jpg`;
// u tekstury -> kat lon (stopnie) w ukladzie kamery
const uToLon=u=>u*360;
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h);cam.aspect=w/h;cam.updateProjectionMatrix()}
addEventListener('resize',resize);resize();
const fade=document.getElementById('fade');
async function go(id,keepView){
  const p=byId[id];fade.classList.add('on');
  const t0=performance.now();let t;
  try{t=await tex(url(variant,id))}catch(e){fade.classList.remove('on');return}
  const wait=Math.max(0,180-(performance.now()-t0));await new Promise(r=>setTimeout(r,wait));
  mat.map=t;mat.needsUpdate=true;cur=id;
  if(!keepView){lon=uToLon(p.start);lat=-4}
  if(p.floor!==floor)setFloor(p.floor);
  document.getElementById('room').textContent=p.name;
  document.getElementById('floorLbl').textContent='Apartament 55 m² · Pobierowo';
  buildHs();markMap();fade.classList.remove('on');
  p.hs.forEach(h=>tex(url(variant,h.to)));
  try{history.replaceState(null,'','#'+id)}catch(e){}
}
const hsBox=document.getElementById('hs');let hsEls=[];
const arrow='<svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>';
function buildHs(){hsBox.innerHTML='';hsEls=byId[cur].hs.map(h=>{const b=document.createElement('button');b.className='hs';b.innerHTML='';b.title=h.label;b.setAttribute('aria-label','Przejdź: '+h.label);
  b.addEventListener('click',e=>{e.stopPropagation();go(h.to)});hsBox.appendChild(b);
  const a=THREE.MathUtils.degToRad(uToLon(h.u));const v=new THREE.Vector3(Math.cos(a),(h.v??-0.28),Math.sin(a)).normalize().multiplyScalar(40);return{b,v}})}
const mapEl=document.getElementById('map'),mapImg=document.getElementById('mapImg');
function setFloor(f){floor=f;mapImg.src='plan_pinea.jpg';document.querySelectorAll('#plan .tabs button').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.f===f)));drawPts()}
function drawPts(){mapEl.querySelectorAll('.pt').forEach(e=>e.remove());P.filter(p=>p.floor===floor).forEach(p=>{const b=document.createElement('button');b.className='pt';b.title=p.name;b.setAttribute('aria-label',p.name);
  b.style.left=p.xy[0]+'%';b.style.top=p.xy[1]+'%';b.dataset.id=p.id;b.onclick=()=>go(p.id);mapEl.appendChild(b)});markMap()}
function markMap(){mapEl.querySelectorAll('.pt').forEach(b=>b.classList.toggle('on',b.dataset.id===cur))}
document.querySelectorAll('#plan .tabs button').forEach(b=>b.onclick=()=>{const f=+b.dataset.f;setFloor(f);if(byId[cur].floor!==f)go(f?'p09':'p03')});
const pl=document.getElementById('plan'),pt=document.getElementById('planToggle');
pt.onclick=()=>{const m=pl.classList.toggle('min');pt.textContent=m?'Pokaż plan':'Ukryj plan';pt.setAttribute('aria-expanded',String(!m))};
if(innerWidth<640){pl.classList.add('min');pt.textContent='Pokaż plan';pt.setAttribute('aria-expanded','false')}
document.querySelectorAll('#variants button').forEach(b=>b.onclick=()=>{variant=b.dataset.v;document.querySelectorAll('#variants button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));go(cur,true)});
// sterowanie
let down=null,pinch=null;const pts=new Map();
stage.addEventListener('pointerdown',e=>{stage.setPointerCapture(e.pointerId);pts.set(e.pointerId,[e.clientX,e.clientY]);down={x:e.clientX,y:e.clientY,lon,lat};stage.classList.add('drag');hideHint();
  if(pts.size===2){const [a,b]=[...pts.values()];pinch={d:Math.hypot(a[0]-b[0],a[1]-b[1]),fov}}});
stage.addEventListener('pointermove',e=>{if(!pts.has(e.pointerId))return;pts.set(e.pointerId,[e.clientX,e.clientY]);
  if(pts.size===2&&pinch){const [a,b]=[...pts.values()];setFov(pinch.fov*pinch.d/Math.hypot(a[0]-b[0],a[1]-b[1]));return}
  if(!down)return;const k=fov/innerHeight;lon=down.lon-(e.clientX-down.x)*k;lat=Math.max(-85,Math.min(85,down.lat+(e.clientY-down.y)*k))});
const up=e=>{pts.delete(e.pointerId);if(pts.size<2)pinch=null;if(!pts.size){down=null;stage.classList.remove('drag')}};
stage.addEventListener('pointerup',up);stage.addEventListener('pointercancel',up);
stage.addEventListener('wheel',e=>{e.preventDefault();setFov(fov+e.deltaY*0.04)},{passive:false});
function setFov(f){fov=Math.max(35,Math.min(95,f));cam.fov=fov;cam.updateProjectionMatrix()}
document.getElementById('zin').onclick=()=>setFov(fov-10);document.getElementById('zout').onclick=()=>setFov(fov+10);
document.getElementById('fs').onclick=()=>{const d=document;try{if(d.fullscreenElement)d.exitFullscreen();else d.documentElement.requestFullscreen().catch(()=>{})}catch(e){}};
addEventListener('keydown',e=>{if(e.key==='ArrowLeft')lon-=5;if(e.key==='ArrowRight')lon+=5;if(e.key==='ArrowUp')lat=Math.min(85,lat+5);if(e.key==='ArrowDown')lat=Math.max(-85,lat-5)});
const hint=document.getElementById('hint');function hideHint(){hint.style.opacity=0}
const tgt=new THREE.Vector3(),tmp=new THREE.Vector3();
function frame(){requestAnimationFrame(frame);
  const phi=THREE.MathUtils.degToRad(90-lat),th=THREE.MathUtils.degToRad(lon);
  tgt.set(Math.sin(phi)*Math.cos(th),Math.cos(phi),Math.sin(phi)*Math.sin(th));cam.lookAt(tgt);renderer.render(scene,cam);
  const w=innerWidth,h=innerHeight;
  for(const {b,v} of hsEls){tmp.copy(v).project(cam);const vis=tmp.z<1&&Math.abs(tmp.x)<1.2&&Math.abs(tmp.y)<1.2;
    b.style.display=vis?'flex':'none';if(vis)b.style.transform=`translate(${(tmp.x*.5+.5)*w}px,${(-tmp.y*.5+.5)*h}px) translate(-50%,-50%) scaleY(.45)`}}
document.querySelectorAll('#units button').forEach(b=>b.onclick=()=>{unit=b.dataset.u;P=PU[unit];byId=Object.fromEntries(P.map(p=>[p.id,p]));document.querySelectorAll('#units button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));setFloor(byId[cur].floor);go(cur)});
setFloor(0);
const start=(location.hash||'').slice(1);go(byId[start]?start:'p01');frame();
</script>
